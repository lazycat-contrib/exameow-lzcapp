params:
  - id: ai_endpoint
    type: string
    name: "AI Endpoint"
    description: "OpenAI-compatible API endpoint URL (e.g., https://api.openai.com/v1)"
    default_value: "https://api.openai.com/v1"
    optional: false

  - id: ai_api_key
    type: secret
    name: "AI API Key"
    description: "API key for the LLM service (optional, can be set later)"
    optional: true

  - id: ai_model
    type: string
    name: "AI Model"
    description: "Model name to use (e.g., gpt-4o, gpt-4o-mini, deepseek-chat)"
    default_value: "gpt-4o"
    optional: false

locales:
  zh:
    ai_endpoint:
      name: "AI 接口地址"
      description: "兼容 OpenAI 的 API 接口地址（例如 https://api.openai.com/v1）"
    ai_api_key:
      name: "AI API 密钥"
      description: "LLM 服务的 API 密钥"
    ai_model:
      name: "AI 模型"
      description: "使用的模型名称（例如 gpt-4o、gpt-4o-mini、deepseek-chat）"